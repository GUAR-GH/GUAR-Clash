name: Feature request
description: Describe a user need and expected behavior.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior and affected platforms
      description: Do not paste private subscriptions, credentials or configurations.
    validations:
      required: true
